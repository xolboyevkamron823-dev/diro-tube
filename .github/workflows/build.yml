name: Build Diro Tube (iOS IPA & Android APK)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./android/gradlew

      - name: Build Android APK
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: DiroTube-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS IPA (for Sideloadly)
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile Native iOS Executable and Package IPA
        run: |
          mkdir -p Payload/DiroTube.app
          
          # 1. Compile native ARM64 Mach-O iOS binary using Apple Clang
          xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=14.0 \
            -framework UIKit -framework WebKit -framework AVFoundation -framework Foundation \
            -fobjc-arc -o Payload/DiroTube.app/DiroTube ios/main.m

          # 2. Copy Web App, Resources & Info.plist
          cp ios/Info.plist Payload/DiroTube.app/
          cp ios/Payload/DiroTube.app/index.html Payload/DiroTube.app/
          if [ -f "ios/Payload/DiroTube.app/1.mp4" ]; then
            cp ios/Payload/DiroTube.app/1.mp4 Payload/DiroTube.app/
          fi

          # 3. Create DiroTube.ipa ready for Sideloadly
          zip -r9 DiroTube.ipa Payload/

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiroTube-iOS-IPA
          path: DiroTube.ipa
          if-no-files-found: error
