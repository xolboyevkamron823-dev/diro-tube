name: Build DiroModLoader

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone fishhook
        run: |
          git clone --depth 1 https://github.com/facebook/fishhook.git

      - name: Compile DiroModLoader.dylib
        run: |
          xcrun --sdk iphoneos clang -shared -arch arm64 -miphoneos-version-min=12.0 \
            -framework Foundation -I fishhook \
            -o DiroModLoader.dylib diro_modloader/DiroModLoader.m fishhook/fishhook.c
          ls -la DiroModLoader.dylib
          file DiroModLoader.dylib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiroModLoader_dylib
          path: DiroModLoader.dylib
