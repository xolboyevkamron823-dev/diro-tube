<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DFF 3D Viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0c0e14; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
    
    .hud-header {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }
    .badge-name {
      background: rgba(22, 27, 38, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    .badge-stats {
      background: rgba(22, 27, 38, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #00d2ff;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    .hud-controls {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      background: rgba(20, 24, 34, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 8px 14px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .btn-ctrl {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn-ctrl:active {
      transform: scale(0.95);
      background: rgba(255, 255, 255, 0.2);
    }
    .btn-ctrl.active {
      background: #007aff;
      border-color: #3897ff;
      color: #fff;
    }

    .loader {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #8e9bb0;
      font-size: 14px;
      text-align: center;
      pointer-events: none;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #007aff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 10px;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="hud-header">
    <div class="badge-name" id="model-name">Model Yuklanmoqda...</div>
    <div class="badge-stats" id="model-stats">0 Vertices</div>
  </div>

  <div class="loader" id="loader">
    <div class="spinner"></div>
    <div>3D Model tayyorlanmoqda...</div>
  </div>

  <div class="hud-controls">
    <button class="btn-ctrl active" id="btn-rotate" onclick="toggleRotate()">🔄 Aylantirish</button>
    <button class="btn-ctrl" id="btn-wireframe" onclick="toggleWireframe()">🕸 Setka</button>
    <button class="btn-ctrl" onclick="resetCamera()">🎯 Markaz</button>
  </div>

  <script src="three.min.js"></script>
  <script src="OrbitControls.js"></script>
  <script src="RenderWare.js"></script>

  <script>
    let scene, camera, renderer, controls, headlight;
    let currentModelGroup = null;
    let autoRotate = true;
    let isWireframe = false;
    let defaultCamDistance = 5;

    function init() {
      const container = document.getElementById('canvas-container');
      const width = window.innerWidth;
      const height = window.innerHeight;

      // 1. Scene
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0c0e14);

      // Gradient ground grid
      const grid = new THREE.GridHelper(30, 30, 0x007aff, 0x222a38);
      grid.position.y = -0.01;
      scene.add(grid);

      // 2. Camera
      camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
      camera.position.set(4, 3, 5);

      // 3. Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2.5));
      renderer.outputEncoding = THREE.sRGBEncoding;
      container.appendChild(renderer.domElement);

      // 4. OrbitControls
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.maxPolarAngle = Math.PI / 2 + 0.1; // Don't flip below ground
      controls.minDistance = 0.5;
      controls.maxDistance = 50;

      // 5. Lights
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
      scene.add(ambientLight);

      headlight = new THREE.DirectionalLight(0xffffff, 0.85);
      headlight.position.set(0, 0, 1);
      scene.add(headlight);

      const topLight = new THREE.DirectionalLight(0xffffff, 0.5);
      topLight.position.set(0, 10, 0);
      scene.add(topLight);

      const fillLight = new THREE.DirectionalLight(0x4466aa, 0.4);
      fillLight.position.set(-5, -5, -5);
      scene.add(fillLight);

      window.addEventListener('resize', onWindowResize, false);
      animate();
    }

    function onWindowResize() {
      if (!camera || !renderer) return;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      if (controls) controls.update();
      if (headlight && camera) {
        headlight.position.copy(camera.position);
      }
      if (currentModelGroup && autoRotate) {
        currentModelGroup.rotation.y += 0.008;
      }
      if (renderer && scene && camera) {
        renderer.render(scene, camera);
      }
    }

    function toggleRotate() {
      autoRotate = !autoRotate;
      document.getElementById('btn-rotate').classList.toggle('active', autoRotate);
    }

    function toggleWireframe() {
      isWireframe = !isWireframe;
      document.getElementById('btn-wireframe').classList.toggle('active', isWireframe);
      if (currentModelGroup) {
        currentModelGroup.traverse(child => {
          if (child.isMesh && child.material) {
            if (Array.isArray(child.material)) {
              child.material.forEach(m => m.wireframe = isWireframe);
            } else {
              child.material.wireframe = isWireframe;
            }
          }
        });
      }
    }

    function resetCamera() {
      if (!currentModelGroup) return;
      controls.reset();
      camera.position.set(defaultCamDistance * 0.8, defaultCamDistance * 0.6, defaultCamDistance);
      controls.target.set(0, 0, 0);
      controls.update();
    }

    function buildThreeGroupFromDFF(dff) {
      const rootGroup = new THREE.Group();
      rootGroup.name = "DFF_Root";
      const frameGroups = [];

      // 1. Create a THREE.Group for each frame
      for (let i = 0; i < dff.frames.length; i++) {
        const frame = dff.frames[i];
        const group = new THREE.Group();
        group.name = frame.name || ("frame_" + i);

        group.position.set(frame.pos[0], frame.pos[1], frame.pos[2]);

        const m = new THREE.Matrix4();
        m.set(
          frame.rot[0], frame.rot[3], frame.rot[6], 0,
          frame.rot[1], frame.rot[4], frame.rot[7], 0,
          frame.rot[2], frame.rot[5], frame.rot[8], 0,
          0, 0, 0, 1
        );
        group.quaternion.setFromRotationMatrix(m);
        frameGroups.push(group);
      }

      // 2. Assemble Hierarchy
      for (let i = 0; i < dff.frames.length; i++) {
        const frame = dff.frames[i];
        const group = frameGroups[i];

        if (frame.parentIndex >= 0 && frame.parentIndex < frameGroups.length) {
          frameGroups[frame.parentIndex].add(group);
        } else {
          rootGroup.add(group);
        }
      }

      // 3. Attach Geometries
      for (let i = 0; i < dff.atomics.length; i++) {
        const at = dff.atomics[i];
        if (at.frameIndex >= frameGroups.length || at.geometryIndex >= dff.geometries.length) continue;

        const targetGroup = frameGroups[at.frameIndex];
        const geom = dff.geometries[at.geometryIndex];
        const bufferGeom = new THREE.BufferGeometry();

        if (geom.vertices && geom.vertices.length > 0) {
          const posArray = new Float32Array(geom.vertices.length * 3);
          for (let v = 0; v < geom.vertices.length; v++) {
            posArray[v * 3] = geom.vertices[v].x;
            posArray[v * 3 + 1] = geom.vertices[v].y;
            posArray[v * 3 + 2] = geom.vertices[v].z;
          }
          bufferGeom.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        }

        if (geom.normals && geom.normals.length > 0) {
          const normArray = new Float32Array(geom.normals.length * 3);
          for (let n = 0; n < geom.normals.length; n++) {
            normArray[n * 3] = geom.normals[n].x;
            normArray[n * 3 + 1] = geom.normals[n].y;
            normArray[n * 3 + 2] = geom.normals[n].z;
          }
          bufferGeom.setAttribute('normal', new THREE.BufferAttribute(normArray, 3));
        } else {
          bufferGeom.computeVertexNormals();
        }

        if (geom.texCoordSets && geom.texCoordSets.length > 0 && geom.texCoordSets[0].length > 0) {
          const uvSet = geom.texCoordSets[0];
          const uvArray = new Float32Array(uvSet.length * 2);
          for (let u = 0; u < uvSet.length; u++) {
            uvArray[u * 2] = uvSet[u].u;
            uvArray[u * 2 + 1] = uvSet[u].v;
          }
          bufferGeom.setAttribute('uv', new THREE.BufferAttribute(uvArray, 2));
        }

        if (geom.colors && geom.colors.length > 0) {
          const colArray = new Float32Array(geom.colors.length * 3);
          for (let c = 0; c < geom.colors.length; c++) {
            colArray[c * 3] = geom.colors[c].r / 255.0;
            colArray[c * 3 + 1] = geom.colors[c].g / 255.0;
            colArray[c * 3 + 2] = geom.colors[c].b / 255.0;
          }
          bufferGeom.setAttribute('color', new THREE.BufferAttribute(colArray, 3));
        }

        // Unpack Tristrips & Multi-Materials
        const unpackedMeshes = DFFModel.getGeometryTriangles(geom);
        let allIndices = [];

        if (unpackedMeshes && unpackedMeshes.length > 0) {
          for (const sub of unpackedMeshes) {
            const start = allIndices.length;
            for (let k = 0; k < sub.indices.length; k++) allIndices.push(sub.indices[k]);
            bufferGeom.addGroup(start, sub.indices.length, sub.matIndex);
          }
        }

        const needsUint32 = (geom.numVertices > 65535) || allIndices.some(idx => idx > 65535);
        if (needsUint32) bufferGeom.setIndex(new THREE.Uint32BufferAttribute(new Uint32Array(allIndices), 1));
        else bufferGeom.setIndex(new THREE.Uint16BufferAttribute(new Uint16Array(allIndices), 1));

        let threeMaterials = [];
        if (geom.materials && geom.materials.length > 0) {
          for (let m = 0; m < geom.materials.length; m++) {
            const mat = geom.materials[m];
            const col = mat.color ? new THREE.Color(mat.color.r / 255, mat.color.g / 255, mat.color.b / 255) : new THREE.Color(0xb5bcc7);
            const threeMat = new THREE.MeshStandardMaterial({
              color: col,
              roughness: 0.35,
              metalness: 0.25,
              side: THREE.DoubleSide,
              wireframe: isWireframe
            });
            threeMaterials.push(threeMat);
          }
        } else {
          const defMat = new THREE.MeshStandardMaterial({
            color: 0xa0a8b4,
            roughness: 0.4,
            metalness: 0.2,
            side: THREE.DoubleSide,
            wireframe: isWireframe
          });
          threeMaterials.push(defMat);
        }

        const frameName = (targetGroup.name || "").toLowerCase().trim();
        // Hide only low LOD (_vlo), damaged parts (_dam), and collision/shadows
        // Never hide dummies (bones/containers) or valid weapon parts like colt45
        const isHidden = frameName.includes("_vlo") || 
                         frameName.includes("_dam") || 
                         frameName.includes("shadow") || 
                         frameName.includes("collision") || 
                         (frameName === "col" || frameName.startsWith("col_") || frameName.endsWith("_col") || frameName.includes("_col_"));

        const mesh = new THREE.Mesh(bufferGeom, threeMaterials.length === 1 ? threeMaterials[0] : threeMaterials);
        mesh.name = targetGroup.name || "part";
        if (isHidden) {
          mesh.visible = false;
        }
        targetGroup.add(mesh);
      }

      // Convert GTA SA Z-Up to Three.js Y-Up (Fix upside-down / standing on nose)
      rootGroup.rotation.x = -Math.PI / 2;

      return rootGroup;
    }

    // Called from Swift: pass base64 encoded DFF bytes
    window.loadDFFFromBase64 = function(base64Str, fileName) {
      document.getElementById('loader').style.display = 'block';
      document.getElementById('model-name').textContent = fileName || '3D Model';

      setTimeout(() => {
        try {
          const binaryString = atob(base64Str);
          const len = binaryString.length;
          const bytes = new Uint8Array(len);
          for (let i = 0; i < len; i++) {
            bytes[i] = binaryString.charCodeAt(i);
          }

          if (currentModelGroup) {
            scene.remove(currentModelGroup);
            currentModelGroup = null;
          }

          const dff = new DFFModel();
          dff.fileName = (fileName || "model").replace(/\.[^/.]+$/, "");
          dff.parse(bytes.buffer);

          currentModelGroup = buildThreeGroupFromDFF(dff);
          currentModelGroup.updateMatrixWorld(true);

          // Compute realistic bounding box using ONLY visible car meshes (ignoring hidden _vlo, col)
          let meshesBox = new THREE.Box3();
          let hasMeshes = false;
          currentModelGroup.traverse(child => {
            if (child.isMesh && child.visible && child.geometry) {
              child.geometry.computeBoundingBox();
              const worldBox = child.geometry.boundingBox.clone().applyMatrix4(child.matrixWorld);
              if (!hasMeshes) {
                meshesBox.copy(worldBox);
                hasMeshes = true;
              } else {
                meshesBox.union(worldBox);
              }
            }
          });

          if (!hasMeshes) {
            meshesBox = new THREE.Box3().setFromObject(currentModelGroup);
          }

          const center = meshesBox.getCenter(new THREE.Vector3());
          const size = meshesBox.getSize(new THREE.Vector3());
          const maxDim = Math.max(size.x, size.y, size.z) || 1.0;

          // Center horizontally (X & Z)
          currentModelGroup.position.x -= center.x;
          currentModelGroup.position.z -= center.z;
          // Place wheels right on ground level (Y = 0)
          currentModelGroup.position.y -= meshesBox.min.y;

          scene.add(currentModelGroup);

          // Update camera
          defaultCamDistance = maxDim * 2.0;
          camera.position.set(defaultCamDistance * 0.9, defaultCamDistance * 0.6, defaultCamDistance);
          camera.near = maxDim * 0.01;
          camera.far = maxDim * 40;
          camera.updateProjectionMatrix();

          controls.target.set(0, size.y / 2, 0);
          controls.update();

          // Count stats of visible meshes
          let totalVerts = 0;
          let totalFaces = 0;
          currentModelGroup.traverse(child => {
            if (child.isMesh && child.visible && child.geometry) {
              if (child.geometry.attributes && child.geometry.attributes.position) {
                totalVerts += child.geometry.attributes.position.count;
              }
              if (child.geometry.index) {
                totalFaces += child.geometry.index.count / 3;
              }
            }
          });

          document.getElementById('model-stats').textContent = `${totalVerts.toLocaleString()} Verts | ${Math.round(totalFaces).toLocaleString()} Polys`;
          document.getElementById('loader').style.display = 'none';

        } catch (err) {
          console.error("DFF yuklash xatosi:", err);
          document.getElementById('loader').innerHTML = `<div style="color: #ff453a; padding: 20px;">Modelni yuklab bo'lmadi:<br><b>${err.message}</b></div>`;
        }
      }, 50);
    };

    window.onload = init;
  </script>
</body>
</html>
