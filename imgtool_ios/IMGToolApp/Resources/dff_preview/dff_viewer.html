<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DFF 3D Viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0c0e14; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
    
    .hud-header {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }
    .badge-name {
      background: rgba(22, 27, 38, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    .badge-stats {
      background: rgba(22, 27, 38, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #00d2ff;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    .hud-controls {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      background: rgba(20, 24, 34, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 8px 14px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .btn-ctrl {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn-ctrl:active {
      transform: scale(0.95);
      background: rgba(255, 255, 255, 0.2);
    }
    .btn-ctrl.active {
      background: #007aff;
      border-color: #3897ff;
      color: #fff;
    }

    .loader {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #8e9bb0;
      font-size: 14px;
      text-align: center;
      pointer-events: none;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #007aff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 10px;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="hud-header">
    <div class="badge-name" id="model-name">Model Yuklanmoqda...</div>
    <div class="badge-stats" id="model-stats">0 Vertices</div>
  </div>

  <div class="loader" id="loader">
    <div class="spinner"></div>
    <div>3D Model tayyorlanmoqda...</div>
  </div>

  <div class="hud-controls">
    <button class="btn-ctrl active" id="btn-rotate" onclick="toggleRotate()">🔄 Aylantirish</button>
    <button class="btn-ctrl" id="btn-wireframe" onclick="toggleWireframe()">🕸 Setka</button>
    <button class="btn-ctrl" onclick="resetCamera()">🎯 Markaz</button>
  </div>

  <script src="three.min.js"></script>
  <script src="OrbitControls.js"></script>
  <script src="RenderWare.js"></script>

  <script>
    let scene, camera, renderer, controls, headlight;
    let currentModelGroup = null;
    let autoRotate = true;
    let isWireframe = false;
    let defaultCamDistance = 5;

    function init() {
      const container = document.getElementById('canvas-container');
      const width = window.innerWidth;
      const height = window.innerHeight;

      // 1. Scene
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0c0e14);

      // Gradient ground grid
      const grid = new THREE.GridHelper(30, 30, 0x007aff, 0x222a38);
      grid.position.y = -0.01;
      scene.add(grid);

      // 2. Camera
      camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
      camera.position.set(4, 3, 5);

      // 3. Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2.5));
      renderer.outputEncoding = THREE.sRGBEncoding;
      container.appendChild(renderer.domElement);

      // 4. OrbitControls
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.maxPolarAngle = Math.PI / 2 + 0.1; // Don't flip below ground
      controls.minDistance = 0.5;
      controls.maxDistance = 50;

      // 5. Lights
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
      scene.add(ambientLight);

      headlight = new THREE.DirectionalLight(0xffffff, 0.85);
      headlight.position.set(0, 0, 1);
      scene.add(headlight);

      const topLight = new THREE.DirectionalLight(0xffffff, 0.5);
      topLight.position.set(0, 10, 0);
      scene.add(topLight);

      const fillLight = new THREE.DirectionalLight(0x4466aa, 0.4);
      fillLight.position.set(-5, -5, -5);
      scene.add(fillLight);

      window.addEventListener('resize', onWindowResize, false);
      animate();
    }

    function onWindowResize() {
      if (!camera || !renderer) return;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      if (controls) controls.update();
      if (headlight && camera) {
        headlight.position.copy(camera.position);
      }
      if (currentModelGroup && autoRotate) {
        currentModelGroup.rotation.y += 0.008;
      }
      if (renderer && scene && camera) {
        renderer.render(scene, camera);
      }
    }

    function toggleRotate() {
      autoRotate = !autoRotate;
      document.getElementById('btn-rotate').classList.toggle('active', autoRotate);
    }

    function toggleWireframe() {
      isWireframe = !isWireframe;
      document.getElementById('btn-wireframe').classList.toggle('active', isWireframe);
      if (currentModelGroup) {
        currentModelGroup.traverse(child => {
          if (child.isMesh && child.material) {
            if (Array.isArray(child.material)) {
              child.material.forEach(m => m.wireframe = isWireframe);
            } else {
              child.material.wireframe = isWireframe;
            }
          }
        });
      }
    }

    function resetCamera() {
      if (!currentModelGroup) return;
      controls.reset();
      camera.position.set(defaultCamDistance * 0.8, defaultCamDistance * 0.6, defaultCamDistance);
      controls.target.set(0, 0, 0);
      controls.update();
    }

    // Called from Swift: pass base64 encoded DFF bytes
    window.loadDFFFromBase64 = function(base64Str, fileName) {
      document.getElementById('loader').style.display = 'block';
      document.getElementById('model-name').textContent = fileName || '3D Model';

      setTimeout(() => {
        try {
          const binaryString = atob(base64Str);
          const len = binaryString.length;
          const bytes = new Uint8Array(len);
          for (let i = 0; i < len; i++) {
            bytes[i] = binaryString.charCodeAt(i);
          }

          if (currentModelGroup) {
            scene.remove(currentModelGroup);
            currentModelGroup = null;
          }

          const clump = RenderWare.parseDFF(bytes.buffer);
          if (!clump || !clump.group) {
            throw new Error("RenderWare parseDFF natija bermadi");
          }

          currentModelGroup = clump.group;

          // Compute realistic bounding box
          const box = new THREE.Box3().setFromObject(currentModelGroup);
          const center = box.getCenter(new THREE.Vector3());
          const size = box.getSize(new THREE.Vector3());
          const maxDim = Math.max(size.x, size.y, size.z) || 1.0;

          // Center model on origin
          currentModelGroup.position.sub(center);
          // Ground level
          currentModelGroup.position.y += size.y / 2;

          scene.add(currentModelGroup);

          // Update camera
          defaultCamDistance = maxDim * 1.8;
          camera.position.set(defaultCamDistance * 0.8, defaultCamDistance * 0.6, defaultCamDistance);
          camera.near = maxDim * 0.01;
          camera.far = maxDim * 20;
          camera.updateProjectionMatrix();

          controls.target.set(0, size.y / 2, 0);
          controls.update();

          // Count stats
          let totalVerts = 0;
          let totalFaces = 0;
          currentModelGroup.traverse(child => {
            if (child.isMesh && child.geometry) {
              if (child.geometry.attributes && child.geometry.attributes.position) {
                totalVerts += child.geometry.attributes.position.count;
              }
              if (child.geometry.index) {
                totalFaces += child.geometry.index.count / 3;
              }
            }
          });

          document.getElementById('model-stats').textContent = `${totalVerts.toLocaleString()} Verts | ${Math.round(totalFaces).toLocaleString()} Polys`;
          document.getElementById('loader').style.display = 'none';

        } catch (err) {
          console.error("DFF yuklash xatosi:", err);
          document.getElementById('loader').innerHTML = `<div style="color: #ff453a;">Modelni yuklab bo'lmadi:<br>${err.message}</div>`;
        }
      }, 50);
    };

    window.onload = init;
  </script>
</body>
</html>
