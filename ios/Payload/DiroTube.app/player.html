<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Diro Tube Player Proxy</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; background:#000; overflow:hidden; }
    iframe { width:100%; height:100%; border:none; display:block; }
  </style>
</head>
<body>
  <iframe id="yt-player" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" 
          allowfullscreen 
          playsinline 
          webkit-playsinline 
          referrerpolicy="strict-origin-when-cross-origin">
  </iframe>

  <script>
    const params = new URLSearchParams(window.location.search);
    let currentVideoId = params.get('v') || 'YzQknv9Z9y8';
    const iframe = document.getElementById('yt-player');

    function getEmbedUrl(vid) {
      return 'https://www.youtube-nocookie.com/embed/' + vid +
             '?autoplay=1&playsinline=1&enablejsapi=1&rel=0&controls=1&modestbranding=1' +
             '&origin=https://xolboyevkamron823-dev.github.io' +
             '&widget_referrer=https://xolboyevkamron823-dev.github.io/diro-tube/';
    }

    // Initialize iframe src with origin compliance
    iframe.src = getEmbedUrl(currentVideoId);

    // Forward messages between parent (Diro Tube app) and YouTube iframe
    window.addEventListener('message', function(event) {
      if (!event.data) return;
      let data = event.data;
      if (typeof data === 'string') {
        try { data = JSON.parse(data); } catch(e) {}
      }

      // Handle loadVideo command without destroying iframe context
      if (data && data.action === 'loadVideo' && data.videoId) {
        if (data.videoId !== currentVideoId) {
          currentVideoId = data.videoId;
          try {
            iframe.contentWindow.postMessage(JSON.stringify({
              event: 'command',
              func: 'loadVideoById',
              args: [currentVideoId]
            }), '*');
          } catch(err) {
            iframe.src = getEmbedUrl(currentVideoId);
          }
        }
        return;
      }

      // 1. From parent app -> to YouTube iframe (Play, Pause, Volume, Seek, SET_EQ, SET_DSP)
      if (iframe && iframe.contentWindow && event.source !== iframe.contentWindow) {
        try {
          const payload = typeof event.data === 'string' ? event.data : JSON.stringify(event.data);
          iframe.contentWindow.postMessage(payload, '*');
        } catch(e) {}
      }

      // 2. From YouTube iframe -> to parent app (Playback progress, State change, Track ended)
      if (event.source === iframe.contentWindow && window.parent && window.parent !== window) {
        try {
          window.parent.postMessage(event.data, '*');
        } catch(e) {}
      }
    });
  </script>
</body>
</html>
